<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{app_name}}</title>
<link rel="icon" type="image/png" href="{{app_icon}}">
<link rel="apple-touch-icon" href="{{app_icon_mobile}}">
<meta name="apple-mobile-web-app-title" content="{{app_name}}">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="/style.css">
</head>
<body>

<!-- The interface font, as symbols. Every glyph on the page points here. -->
{{glyph_symbols}}

<!-- The app's own header. It is the same on every page: each tool names itself
     in the title at the top of its page. -->
<header class="bar">
  <div class="brand">
    <h1>
      <img class="logo" src="{{app_icon}}" alt="">
      <span><span class="lead">{{brand_lead}}</span> <span>{{brand_tail}}</span></span>
    </h1>
    <span class="developer-credit">{{developer_credit}}</span>
  </div>
  <p class="dict app-description" id="appInfo">
    <span>{{app_description_lead}}</span> <span>{{app_description_tail}}</span>
  </p>
</header>

<main>

  <!-- The row above every page: the way back on the left, the app's own
       settings on the right. The back button is hidden on the home screen;
       the switch stays, because it is not about any one tool. -->
  <div class="pagebar">
    <button type="button" class="backbtn" id="back" title="{{title_back}}" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor"
           stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 5 L8 12 L15 19"/>
      </svg>
      <span>{{btn_back}}</span>
    </button>

    <label class="switch">
      <span class="switch-label">{{toggle_sound}}</span>
      <input type="checkbox" id="sound">
      <span class="track" aria-hidden="true"><span class="knob"></span></span>
    </label>
  </div>

  <!-- The home screen: one card per tool in ui.py's TOOLS. -->
  <section class="page" id="page-home">
    <h2 class="pagetitle">{{home_heading}}</h2>
    <p class="dict pagehint">{{home_hint}}</p>
    <div class="menu" id="menu"></div>
  </section>

  <!-- Every tool page is built into here by app.js. -->
  <section class="page" id="page-tool" hidden></section>

  <section id="status" class="status" aria-live="polite"></section>

</main>

<!-- One dialog, reused: its words are set by whoever asks. -->
<dialog id="confirmDialog" class="confirm-dialog" aria-labelledby="confirmTitle"
        aria-describedby="confirmMessage">
  <form method="dialog">
    <h2 id="confirmTitle"></h2>
    <p id="confirmMessage"></p>
    <p id="confirmNote" class="dialog-note" hidden></p>
    <div class="dialog-actions">
      <button type="submit" class="secondary-btn" value="cancel" autofocus>{{btn_cancel}}</button>
      <button type="submit" class="primary-btn" value="confirm" id="confirmGo">{{btn_confirm}}</button>
    </div>
  </form>
</dialog>

<div class="toasts" id="toasts" aria-live="polite" aria-atomic="true"></div>

<script src="/app.js"></script>
{{tool_scripts}}
</body>
</html>
