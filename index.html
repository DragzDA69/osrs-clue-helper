<meta name="apple-mobile-web-app-title" content="Clue Helper">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>:root {
  --bg: #11131a;
  --panel: #181b24;
  --panel-2: #1f2430;
  --line: #2b3140;
  --ink: #e6e9f0;
  --ink-dim: #9aa3b5;
  --ink-faint: #6b7489;
  --placeholder: #4d5360;
  --arrow-stroke: 0.5px;   /* how heavy the ↓ / → disclosure arrows read */
  --arrow-long: 1.2;       /* stretch along the arrow's own axis */
  --arrow-wide: 1.18;      /* and across it */
  --accent: #6ea8fe;
  --accent-ink: #0d1117;
  --wild: #f0b45e;
  --radius: 10px;
  --toast-fade: 220ms;
}

@media (prefers-color-scheme: light) {
  :root {
    --bg: #f4f6fa;
    --panel: #ffffff;
    --panel-2: #eef1f7;
    --line: #d9dfea;
    --ink: #1a1f2b;
    --ink-dim: #5a6479;
    --ink-faint: #8a93a6;
    --placeholder: #b0b6c4;
    --accent: #2f6fe4;
    --accent-ink: #ffffff;
    --wild: #a96a12;
  }
}

* { box-sizing: border-box; }

/* The hidden attribute loses to any author `display` rule -- a card is a grid,
   a page is a block -- so toggling it would otherwise do nothing at all. */
[hidden] { display: none !important; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}

.bar {
  display: flex;
  /* Centre, not baseline: the h1 starts with the icon, and a flex container
     whose first item has no text baseline reports its bottom edge instead --
     which dropped the description below the title. */
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
  padding: 18px 24px;
  border-bottom: 1px solid var(--line);
  background: var(--panel);
}
.bar h1 {
  display: flex;
  align-items: center;
  gap: 9px;
  margin: 0;
  font-size: 17px;
  font-weight: 650;
  letter-spacing: -0.01em;
  white-space: nowrap;
}
.brand {
  display: flex;
  flex-direction: column;
  flex: none;
  gap: 0;
}
.developer-credit {
  margin-left: 31px;
  color: var(--ink-faint);
  font-size: 11px;
  white-space: nowrap;
}
.bar.compact .brand {
  flex-direction: row;
  align-items: center;
  flex-wrap: wrap;
  gap: 6px 16px;
  max-width: 100%;
}
.bar.compact .developer-credit { margin-left: 0; }
.bar.compact #appInfo { flex-basis: 100%; }
.dict.app-description { font-size: 16px; }
.bar:not(.compact) #appInfo {
  align-self: flex-start;
  padding-top: 1.5px;
}
/* Decorative: the name is right beside it, so it carries an empty alt. */
.logo { width: 22px; height: 22px; flex: none; border-radius: 5px; object-fit: contain; }
.bar h1 .lead { color: var(--ink-faint); font-weight: 400; }
.dict { margin: 0; color: var(--ink-faint); font-size: 13px; }
/* Each sentence is its own block, so when the line is too narrow the break
   falls between them instead of part-way through one. */
.dict span { display: inline-block; }

main { max-width: 1100px; margin: 0 auto; padding: 24px; }

/* --- the row above every page --------------------------------------------
   The way back on the left, the sound switch on the right, both aligned with
   the content's own edges. On the home screen the back button is gone and the
   switch keeps its place. */
.pagebar {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 16px;
  min-height: 34px;
}
.pagebar .switch { margin-left: auto; }

.backbtn {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  margin: 0 0 0 -8px;
  padding: 6px 12px 6px 8px;
  background: none;
  border: 1px solid transparent;
  border-radius: 8px;
  color: var(--ink-dim);
  font: inherit;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: color 0.15s, background 0.15s;
}
.backbtn svg { width: 18px; height: 18px; flex: none; }
.backbtn:hover { color: var(--ink); background: var(--panel-2); }
.backbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Titles are centred on every page, tool and home alike. */
.pagetitle {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 11px;
  margin: 0;
  text-align: center;
  font-size: 22px;
  font-weight: 650;
  letter-spacing: -0.01em;
}
/* The tool page repeats the card's icon beside its name, at the same scale
   the card shows it, so the two read as the same object. */
.pagetitle .toolicon { width: 34px; height: 34px; flex: none; object-fit: contain; }
.pagehint { margin-top: 6px; text-align: center; }

/* --- the sound switch ----------------------------------------------------
   A real checkbox, hidden but still the thing that is clicked, focused and
   read out; the pill and its knob are drawn from it. */
.switch {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  cursor: pointer;
  user-select: none;
}
.switch-label {
  font-size: 14px;
  font-weight: 600;
  color: var(--ink-dim);
  transition: color 0.15s;
}
.switch:hover .switch-label { color: var(--ink); }
.switch input {
  position: absolute;
  width: 1px;
  height: 1px;
  opacity: 0;
  pointer-events: none;
}
.switch .track {
  position: relative;
  flex: none;
  width: 46px;
  height: 26px;
  border-radius: 999px;
  background: var(--panel-2);
  border: 1px solid var(--line);
  transition: background 0.16s, border-color 0.16s;
}
.switch .knob {
  position: absolute;
  top: 50%;
  left: 2px;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: var(--ink-faint);
  transform: translateY(-50%);
  transition: transform 0.16s cubic-bezier(0.22, 0.8, 0.3, 1), background 0.16s;
}
.switch input:checked + .track {
  background: var(--accent);
  border-color: transparent;
}
.switch input:checked + .track .knob {
  transform: translate(20px, -50%);
  background: #fff;
}
.switch input:checked ~ .switch-label,
.switch:has(input:checked) .switch-label { color: var(--ink); }
.switch input:focus-visible + .track { outline: 2px solid var(--accent); outline-offset: 3px; }
@media (prefers-reduced-motion: reduce) {
  .switch .track, .switch .knob { transition: none; }
}

/* --- the home menu -------------------------------------------------------
   Cards that stretch to fill the row, so two tools are two halves and the
   grid never leaves a lone stranded card on a wide screen. */
.menu {
  margin-top: 20px;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 14px;
}
.tile {
  display: grid;
  grid-template-columns: auto 1fr;
  align-items: center;
  gap: 14px;
  width: 100%;
  padding: 18px 20px;
  text-align: left;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  color: var(--ink);
  font: inherit;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  transition: border-color 0.14s, background 0.14s, transform 0.08s;
}
.tile:hover { border-color: var(--accent); background: var(--panel-2); }
.tile:active { transform: scale(0.99); }
.tile:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.tile img {
  width: 44px;
  height: 44px;
  object-fit: contain;
  /* OSRS sprites are small and crisp; let them stay that way when scaled. */
  image-rendering: -webkit-optimize-contrast;
}
.tile .name {
  display: block;
  font-size: 16px;
  font-weight: 650;
  letter-spacing: -0.01em;
}
.tile .blurb {
  display: block;
  margin-top: 2px;
  color: var(--ink-faint);
  font-size: 13px;
  line-height: 1.4;
}

/* --- a tool's own surface ------------------------------------------------ */
.card {
  margin-top: 20px;
  padding: 20px;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: var(--radius);
}
.card { text-align: center; }
.card h3 { margin: 0 0 8px; font-size: 15px; font-weight: 650; }
.card p { margin: 0; color: var(--ink-dim); font-size: 14px; }

.label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--ink-dim);
  margin-bottom: 6px;
}
.hint { display: block; margin-top: 5px; font-size: 12px; color: var(--ink-faint); }

kbd {
  font: inherit;
  font-size: 11px;
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 0 4px;
}

input[type=text], input[type=number], select {
  width: 100%;
  background: var(--panel-2);
  border: 1px solid var(--line);
  border-radius: 8px;
  color: var(--ink);
  padding: 9px 11px;
  font: inherit;
}
input[type=number] {
  -moz-appearance: textfield;
  appearance: textfield;
}
input[type=number]::-webkit-inner-spin-button,
input[type=number]::-webkit-outer-spin-button {
  -webkit-appearance: none;
  margin: 0;
}
/* The opacity is set explicitly rather than left alone: Firefox applies its
   own, so leaving it out makes the two browsers disagree about how faint
   this is. */
::placeholder { color: var(--placeholder); opacity: 0.7; }

input:focus, select:focus, button:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 1px;
}

/* Sits inside a field, vertically centred whatever the input's height. */
.clearbtn {
  position: absolute;
  top: 50%;
  right: 10px;
  transform: translateY(-50%);
  display: grid;
  place-items: center;
  width: 36px;
  height: 36px;
  padding: 0;
  background: transparent;
  border: 0;
  border-radius: 8px;
  color: var(--ink-faint);
  cursor: pointer;
}
.clearbtn.small { width: 28px; height: 28px; right: 8px; }
.clearbtn svg { display: block; width: 20px; height: 20px; }
.clearbtn.small svg { width: 16px; height: 16px; }
.clearbtn:hover { background: var(--panel-2); color: var(--ink); }
.clearbtn:active, .clearbtn.small:active { transform: translateY(-50%) scale(0.92); }

.seg { display: flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button {
  background: var(--panel-2);
  border: 0;
  color: var(--ink-dim);
  font: inherit;
  font-size: 13px;
  padding: 7px 13px;
  cursor: pointer;
}
.seg button + button { border-left: 1px solid var(--line); }
.seg button.on { background: var(--accent); color: var(--accent-ink); font-weight: 600; }
.seg button:hover:not(.on) { color: var(--ink); }

button[type=submit], .primary-btn, .secondary-btn {
  border-radius: 8px;
  font: inherit;
  font-weight: 600;
  padding: 9px 18px;
  cursor: pointer;
  border: 1px solid var(--line);
}
button[type=submit], .primary-btn {
  background: var(--accent);
  color: var(--accent-ink);
  border-color: transparent;
  transition: filter 0.15s;
}
button[type=submit]:hover, .primary-btn:hover:not(:disabled) { filter: brightness(1.08); }
.primary-btn:disabled { opacity: 0.4; cursor: not-allowed; }
button.secondary-btn {
  background: var(--panel-2);
  color: var(--ink-dim);
  border-color: var(--line);
  transition: filter 0.15s, color 0.15s;
}
.secondary-btn:hover:not(:disabled) { filter: brightness(1.08); color: var(--ink); }
.secondary-btn:disabled { opacity: 0.4; cursor: not-allowed; }

.status {
  margin: 18px 2px 0;
  font-size: 14px;
  color: var(--ink-dim);
  min-height: 21px;
  text-align: center;
  /* A solver's message can carry a line break; this is what renders it. */
  white-space: pre-line;
}
.status.err { color: #ff8585; }

.empty { color: var(--ink-faint); padding: 20px 2px; }

/* --- OSRS buttons --------------------------------------------------------
   Three background sprites in total -- up, hover, selected -- and the letter
   laid over the middle from the glyph sheet. A new label is a character of
   markup, not three more files.

   Everything is sized from --btn-px, one game pixel, so a button and the
   letter on it scale together and stay on the same grid. */
.glyph-sheet { position: absolute; width: 0; height: 0; overflow: hidden; }

/* A character of the interface font, anywhere on the page. It takes its
   colour from `fill`, so a glyph can be tinted like text. */
.rs-glyph {
  display: block;
  width: calc(var(--glyph-w) * var(--btn-px, 2px));
  height: calc(var(--glyph-h) * var(--btn-px, 2px));
  fill: currentColor;
  /* Pixel art: snap the edges rather than smoothing them. */
  shape-rendering: crispEdges;
}

  --btn-px: 2px;
  --btn-ink: #f49540;

  place-items: center;

/* A button whose turn has not come sits a shade darker, the way a disabled
   control usually does. Darkened rather than faded: opacity lets the panel
   behind show through, which reads as an overlay laid on the artwork instead
   of as a button that is out of reach. */
.osrs-btn:disabled {
  cursor: default;
  filter: brightness(0.78) saturate(0.9);
}
.osrs-btn:disabled .rs-glyph { transform: none; }

.osrs-chip::before { background: #ffffff; }
.osrs-chip::after { background: linear-gradient(to bottom, #7a1414, #4a0808); }

@media (hover: hover) {
  .osrs-chip:hover::before { opacity: 0.1; }
  .osrs-chip:hover { --btn-ink: #ffb259; }
}
.osrs-chip[aria-pressed="true"]::after { opacity: 0.7; }
.osrs-chip[aria-pressed="true"] { --btn-ink: #ffffff; }
/* Pressed in, so the letter sits a pixel down and right, as on a lever. */
.osrs-chip:hover .rs-glyph,
.osrs-chip[aria-pressed="true"] .rs-glyph {
  transform: translate(var(--btn-px), var(--btn-px));
}
.osrs-chip .rs-glyph { position: relative; z-index: 1; }
.osrs-chip:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* The answer: a caption, then the chips in the same four-by-two arrangement
   the levers are in on the box itself. */
.answer {
  width: min(100%, 520px);
  margin: 22px auto 0;
  container-type: inline-size;
  text-align: center;
}
.answer p { margin: 0 0 12px; font-size: 14px; color: var(--ink); }
.osrs-chip-row {
  display: grid;
  grid-template-columns: repeat(4, max-content);
  justify-content: center;
  gap: 8px;
}

/* A row of them, as the levers sit under the light box. */
.osrs-btn-row {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 8px;
}

/* --- the light box -------------------------------------------------------
   The box is the artwork itself, with a hit area sitting over each painted-on
   bulb. Every position below is a percentage of the picture, measured off
   light_box_start.png, so the whole thing scales with the screen and the
   lights stay on their sockets at any size. */
.lightbox {
  position: relative;
  /* How wide the box is allowed to get. The answer row below it is capped to
     the same number, so a chip sized in cqw there comes out the same height
     as a lever sized in cqw here. */
  --lb-max: 520px;
  /* The levers inside are placed in cqw -- hundredths of this box's width --
     so every measurement taken off the artwork stays true at any size. */
  container-type: inline-size;
  width: min(100%, var(--lb-max));

.lightbox .light {
  position: absolute;
  width: 8.498%;
  height: 9.207%;
  padding: 0;
  background: none;
  border: 0;
  border-radius: 6px;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.lightbox .light:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
/* Both bulbs sit in the socket, one over the other, and the pair cross-fade.
   The unlit one is there so that hovering an *off* light can shrink it too --
   the bulb painted into the background cannot be touched. It covers the
   painted one exactly, so nothing moves when it loads. */
.lightbox .light i {
  position: absolute;
  inset: 0;
  background-size: 100% 100%;
  background-repeat: no-repeat;
  /* Scaled up from 26px, so keep the pixels square rather than blurred. */
  image-rendering: pixelated;
  transition: opacity 90ms ease, transform 110ms ease;
}

.lightbox .light.on .on { opacity: 1; }
.lightbox .light.on .off { opacity: 0; }

/* A board that is not being read yet takes no clicks, and says so by not
   reacting to the pointer at all. */
.lightbox .light:disabled { pointer-events: none; }

/* A bulb gives a little under the pointer, so it is obvious which socket a
   click would land in. Small on hover, a touch more on the press itself. */
@media (hover: hover) {
  .lightbox .light:hover i { transform: scale(0.94); }
}
.lightbox .light:active i { transform: scale(0.89); }
@media (prefers-reduced-motion: reduce) {
  .lightbox .light i { transition: none; }
}

/* The eight levers, laid over the ones painted into the artwork. Their size
   is the painted button's, measured off light_box_start.png, rather than the
   sprite's own -- the two differ slightly in proportion, and matching the
   painting is what makes the overlay invisible.

   --btn-px is set so the letter comes out the size the game draws it; the
   button's own width and height are given here instead of derived from it. */
.lightbox .lever {
  position: absolute;
  /* 214x98 artwork pixels, measured outline to outline -- the first attempt
     measured only the face inside the bevel, and left a rim of the painted
     button showing all round. --btn-px follows from the height, so the letter
     lands the size the game draws it. */
  --btn-px: 0.3127cqw;
  width: 21.167cqw;
  height: 9.693cqw;
}

/* What to do first, above the board. It is emptied once that step is done but
   keeps its height, so the board and the buttons below do not jump upward
   just as a finger is lifting off Set Start. */
.startprompt {
  margin: 14px 2px 10px;
  min-height: 21px;
  font-size: 14px;
  color: var(--ink-dim);
  text-align: center;
}

/* The row of actions under a tool. */
.toolactions {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin-top: 18px;
}

/* --- the confirm dialog --------------------------------------------------
   One dialog serves every tool; only its words change. */
.confirm-dialog {
  width: min(420px, calc(100% - 32px));
  max-height: calc(100% - 32px);
  padding: 24px;
  background: var(--panel);
  color: var(--ink);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: 0 16px 48px rgba(0, 0, 0, 0.35);
}
.confirm-dialog::backdrop { background: rgba(0, 0, 0, 0.6); }
.confirm-dialog h2 { margin: 0 0 12px; font-size: 18px; }
.confirm-dialog p { margin: 0 0 10px; color: var(--ink-dim); font-size: 14px; }
/* The consequence, on its own line and a shade stronger than the sentence
   above it -- it is the part worth reading twice. */
.confirm-dialog .dialog-note {
  margin-bottom: 24px;
  color: var(--ink);
  font-weight: 600;
}
.confirm-dialog p:last-of-type { margin-bottom: 24px; }
.dialog-actions {
  display: flex;
  justify-content: flex-end;
  align-items: center;
  gap: 10px;
}

/* --- toast ---------------------------------------------------------------
   A confirmation that behaves like an Android toast: it slides and fades up
   from the bottom, waits, then goes back down. The host never takes a pointer
   event, so nothing underneath is ever blocked. */
.toasts {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 50;
  display: flex;
  justify-content: center;
  padding: 0 16px calc(26px + env(safe-area-inset-bottom, 0px));
  pointer-events: none;
}
.toast {
  display: flex;
  align-items: center;
  gap: 7px;
  max-width: 100%;
  background: var(--accent);
  color: var(--accent-ink);
  border: 1px solid transparent;
  border-radius: 8px;
  padding: 9px 18px;
  font-size: 14px;
  font-weight: 600;
  line-height: 1.3;
  box-shadow: 0 8px 28px rgba(0, 0, 0, 0.3);
  pointer-events: none;
  opacity: 0;
  transform: translateY(28px);
  transition: opacity var(--toast-fade) ease,
              transform var(--toast-fade) cubic-bezier(0.22, 0.8, 0.3, 1);
}
.toast.show { opacity: 1; transform: translateY(0); }
/* A solid dark chip, a shade off the toast's own ink (--accent-ink is #0d1117
   in the dark theme) rather than a wash of the accent underneath. Flat so it
   holds the same colour in both themes; white on it runs about 17:1. */
.toast code {
  font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
  font-size: 13px;
  color: #fff;
  background: #161b24;
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 5px;
  padding: 1px 7px;
}

@media (prefers-reduced-motion: reduce) {
  .toast { transform: none; transition: opacity 0.12s linear; }
  .toast.show { transform: none; }
}

/* Phones: the bar loses its side padding to the content, and a card is the
   full width of the screen rather than a column of two. */
@media (max-width: 480px) {
  .bar { padding: 14px 16px; }
  main { padding: 18px 16px; }
  .pagetitle { font-size: 20px; }
  .tile { padding: 15px 16px; gap: 12px; }
  .tile img { width: 38px; height: 38px; }
  /* The switch keeps its full size -- it is a tap target -- so the label is
     what gives way when the row runs out of room. */
  .switch-label { font-size: 13px; }
  .pagebar { gap: 8px; }
}
</style>
</head>

<main>

  <!-- The row above every page: the way back on the left, the app's own
       settings on the right. The back button is hidden on the home screen;
       the switch stays, because it is not about any one tool. -->
  <div class="pagebar">
    <button type="button" class="backbtn" id="back" title="Back to all tools" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor"
           stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 5 L8 12 L15 19"/>
      </svg>
      <span>All tools</span>
    </button>

    <label class="switch">
      <span class="switch-label">Disable Sounds</span>
      <input type="checkbox" id="mute">
      <span class="track" aria-hidden="true"><span class="knob"></span></span>
    </label>
  </div>

  <!-- The home screen: one card per tool in ui.py's TOOLS. -->
  <section class="page" id="page-home">
    <h2 class="pagetitle">Tools</h2>
    <p class="dict pagehint">Choose the clue step you are stuck on.</p>
    <div class="menu" id="menu"></div>
  </section>

  <!-- Every tool page is built into here by app.js. -->
  <section class="page" id="page-tool" hidden></section>

  <section id="status" class="status" aria-live="polite"></section>

</main>

<!-- One dialog, reused: its words are set by whoever asks. -->
<dialog id="confirmDialog" class="confirm-dialog" aria-labelledby="confirmTitle"
        aria-describedby="confirmMessage">
  <form method="dialog">
    <h2 id="confirmTitle"></h2>
    <p id="confirmMessage"></p>
    <p id="confirmNote" class="dialog-note" hidden></p>
    <div class="dialog-actions">
      <button type="submit" class="secondary-btn" value="cancel" autofocus>Cancel</button>
      <button type="submit" class="primary-btn" value="confirm" id="confirmGo">Confirm</button>
    </div>
  </form>
</dialog>

<div class="toasts" id="toasts" aria-live="polite" aria-atomic="true"></div>

<script>"use strict";

/* The shell: a home menu of tools, and one page per tool.
 *
 * The tool list is not written here -- it is rendered in from ui.py's TOOLS, so
 * the menu, the routes and the browser titles all come from one definition.
 * A tool's own code registers itself with `registerTool(id, { mount })` and is
 * handed the page element when its route opens; until one does, the page shows
 * a placeholder. That keeps every tool a self-contained file that knows nothing
 * about routing.
 *
 * Routing is by hash (#/light-box) rather than by path: the standalone build is
 * opened straight from the filesystem or from GitHub Pages, where there is no
 * server to map a path onto a page.

const TOAST_MS = +"2000", TOAST_FADE_MS = +"220";
const APP_NAME = "Clue Helper";
const byId = new Map(TOOLS.map((tool) => [tool.id, tool]));

const implementations = new Map();
window.registerTool = (id, impl) => {
  implementations.set(id, impl);
  if (current && current.id === id) openTool(id);
};

let current = null;       // the tool whose page is showing, or null on home
let teardown = null;      // whatever the last mount handed back, to undo

// --- the home menu --------------------------------------------------------

function buildMenu() {
  const frag = document.createDocumentFragment();
  for (const tool of TOOLS) {
    const tile = document.createElement("button");
    tile.type = "button";
    tile.className = "tile";
    tile.dataset.tool = tool.id;

    const icon = document.createElement("img");
    icon.src = tool.icon;
    icon.alt = "";          // decorative: the name is right beside it
    icon.loading = "lazy";

    const text = document.createElement("span");
    const name = document.createElement("span");
    name.className = "name";
    name.textContent = tool.title;
    text.append(name);
    if (tool.blurb) {
      const blurb = document.createElement("span");
      blurb.className = "blurb";
      blurb.textContent = tool.blurb;
      text.append(blurb);
    }

    tile.append(icon, text);
    frag.append(tile);
  }
  $("menu").replaceChildren(frag);
}

/* One listener for the whole menu rather than one per card. */
$("menu").addEventListener("click", (event) => {
  const tile = event.target.closest(".tile");
  if (tile) go(tile.dataset.tool);
});

$("back").addEventListener("click", () => go(null));

// --- routing --------------------------------------------------------------

function go(id) {
  location.hash = id ? "#/" + id : "";
}

function routeFromHash() {
  const id = location.hash.replace(/^#\/?/, "").trim();
  return id && byId.has(id) ? id : null;
}

function render() {
  const id = routeFromHash();
  if (id) openTool(id);
  else openHome();
}

function openHome() {
  releaseTool();
  current = null;
  $("page-tool").hidden = true;
  $("page-tool").replaceChildren();
  $("page-home").hidden = false;
  $("back").hidden = true;
  setBrand(null);
  flash("");
  syncBrandLayout();
}

function openTool(id) {
  const tool = byId.get(id);
  if (!tool) return openHome();

  releaseTool();
  current = tool;
  $("page-home").hidden = true;
  $("back").hidden = false;

  const page = $("page-tool");
  page.hidden = false;
  page.replaceChildren(toolHeading(tool), toolBody(tool));
  setBrand(tool);
  flash("");
  syncBrandLayout();

  const impl = implementations.get(id);
  if (impl && typeof impl.mount === "function") {
    teardown = impl.mount(page.querySelector(".toolbody"), tool) || null;
  }
}

function releaseTool() {
  if (typeof teardown === "function") teardown();
  teardown = null;
}

function toolHeading(tool) {
  const h = document.createElement("h2");
  h.className = "pagetitle";

  const icon = document.createElement("img");
  icon.className = "toolicon";
  icon.src = tool.icon;
  icon.alt = "";
  h.append(icon, document.createTextNode(tool.title));
  return h;
}

function toolBody(tool) {
  const body = document.createElement("div");
  body.className = "toolbody";
  if (implementations.has(tool.id)) return body;

  const card = document.createElement("div");
  card.className = "card";
  const heading = document.createElement("h3");
  heading.textContent = "Nothing here yet";
  const text = document.createElement("p");
  text.textContent = "This tool is still being built. The page, the route and the layout are in place, so the solver can drop straight in.";
  card.append(heading, text);
  body.append(card);
  return body;
}

function setBrand(tool) {
  const icon = $("brandIcon");
  const name = $("brandName");
  if (tool) {
    icon.src = tool.icon;
    name.textContent = tool.title;
    $("appInfo").hidden = true;
    document.title = tool.title + " · " + APP_NAME;
  } else {
    icon.src = HOME_ICON;
    name.replaceChildren(span("lead", "Clue"),
                         document.createTextNode(" "),
                         span("", "Helper"));
    $("appInfo").hidden = false;
    document.title = APP_NAME;
  }
}

function span(cls, text) {
  const el = document.createElement("span");
  if (cls) el.className = cls;
  el.textContent = text;
  return el;
}

// --- status line ----------------------------------------------------------

function flash(message, isError) {
  const status = $("status");
  status.innerHTML = message || "";
  status.classList.toggle("err", Boolean(isError));
}
window.flash = flash;

// --- OSRS buttons ---------------------------------------------------------

const SVG_NS = "http://www.w3.org/2000/svg";

function glyphId(char) {
  return char === char.toLowerCase() && char !== char.toUpperCase()
    ? char.toUpperCase() + "-lower"
    : char;
}

function rsGlyph(char) {
  const id = glyphId(char);
  const symbol = document.getElementById("g-" + id);
  if (!symbol) throw new Error("No glyph for " + JSON.stringify(char));

  const svg = document.createElementNS(SVG_NS, "svg");
  svg.setAttribute("class", "rs-glyph");
  svg.setAttribute("aria-hidden", "true");
  const box = symbol.viewBox.baseVal;

// --- confirming -----------------------------------------------------------

function confirmAction({ title, message, note, confirm }) {
  const dialog = $("confirmDialog");
  const noteEl = $("confirmNote");
  $("confirmTitle").textContent = title;
  $("confirmMessage").textContent = message;
  noteEl.textContent = note || "";
  noteEl.hidden = !note;
  if (confirm) $("confirmGo").textContent = confirm;

  return new Promise((resolve) => {
    const buttons = [...dialog.querySelectorAll("button[value]")];

    function finish(agreed) {
      for (const button of buttons) button.removeEventListener("click", onClick);
      dialog.removeEventListener("cancel", onCancel);
      dialog.removeEventListener("close", onClose);
      if (dialog.open) dialog.close();
      resolve(agreed);
    }
    function onClick(event) { finish(event.currentTarget.value === "confirm"); }
    function onCancel() { finish(false); }            // Escape
    function onClose() { finish(dialog.returnValue === "confirm"); }

    for (const button of buttons) button.addEventListener("click", onClick);
    dialog.addEventListener("cancel", onCancel);
    dialog.addEventListener("close", onClose);
    dialog.showModal();
  });
}

const MUTE_KEY = "clue-helper.mute";

function playSound(url) {
  if (muted) return;
  let source = sounds.get(url);
  if (!source) {
    source = new Audio(url);
    source.preload = "auto";
    sounds.set(url, source);

  const play = source.cloneNode();
  play.volume = 0.5;
  const started = play.play();
  if (started) started.catch(() => {});
}

// --- copying --------------------------------------------------------------

async function copyText(text) {
  try {
    await navigator.clipboard.writeText(text);
  } catch {
    if (!legacyCopy(text)) {
      flash("Clipboard blocked by the browser", true);
      return;
    }
  }
  toast(text);
}
window.copyText = copyText;

function legacyCopy(text) {
  const ta = document.createElement("textarea");
  ta.value = text;
  ta.style.position = "fixed";
  ta.style.opacity = "0";
  document.body.append(ta);
  ta.select();
  let ok = false;
  try { ok = document.execCommand("copy"); } catch {}
  ta.remove();
  return ok;
}

function toast(text) {
  const host = $("toasts");
  for (const old of host.querySelectorAll(".toast")) {
    clearTimeout(old.dismiss);
    old.remove();
  }

  const el = document.createElement("div");
  el.className = "toast";
  const chip = document.createElement("code");
  chip.textContent = text;
  el.append(chip, document.createTextNode(" was copied to the clipboard"));
  host.append(el);

  // Two frames, so the browser paints the off-screen state before it animates.
  requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add("show")));

  el.dismiss = setTimeout(() => {
    el.classList.remove("show");
    el.dismiss = setTimeout(() => el.remove(), TOAST_FADE_MS + 80);
  }, TOAST_MS);
}
window.toast = toast;

// --- the solver bridge ----------------------------------------------------

async function solve(tool, payload) {
  const local = window.LOCAL_SOLVERS && window.LOCAL_SOLVERS[tool];
  if (local) {
    try {
      return await local(payload);
    } catch (exc) {
      return { ok: false, error: exc.message };
    }
  }
  try {
    const res = await fetch("/api/solve/" + encodeURIComponent(tool), {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(payload),
    });
    return await res.json();
  } catch {
    return { ok: false, error: "Lost contact with the local server. Is server.py still running?" };
  }
}
window.solve = solve;

const HOME_ICON = $("brandIcon").src;

function syncBrandLayout() {
  const bar = document.querySelector(".bar");
  const info = $("appInfo");
  if (info.hidden) {       // a tool page shows only the name: never compact
    bar.classList.remove("compact");
    return;
  }
  const style = getComputedStyle(bar);
  const available = bar.clientWidth - parseFloat(style.paddingLeft)
    - parseFloat(style.paddingRight);
  // Measure the unwrapped copy, not its current (possibly wrapped) width.
  const probe = info.cloneNode(true);
  probe.removeAttribute("id");
  probe.style.cssText =
    "position:fixed;visibility:hidden;width:max-content;white-space:nowrap";
  document.body.append(probe);
  const required = bar.querySelector("h1").getBoundingClientRect().width
    + parseFloat(style.columnGap) + probe.getBoundingClientRect().width;
  probe.remove();
  bar.classList.toggle("compact", required > available);
}

window.addEventListener("hashchange", render);

(function init() {
  // The switch starts where the remembered choice left it, not where the
  // markup does.
  $("mute").checked = muted;
  buildMenu();
  render();
  let headerWidth = null;
  new ResizeObserver(([entry]) => {
    if (entry.contentRect.width === headerWidth) return;
    headerWidth = entry.contentRect.width;
    syncBrandLayout();
  }).observe(document.querySelector(".bar"));
  document.fonts.ready.then(syncBrandLayout);
})();

/* The Light Box solver, for the build that has no Python behind it.
 *
 * server.py never serves this file: it is inlined only into the standalone
 * index.html, the one that runs from GitHub Pages or straight off a phone.
 * Locally, solvers/light_box.py answers instead, and app.js's solve() prefers
 * the server whenever there is one -- so the two never both run.
 *
 * It is a port of the same comparison.js the Python is a port of, and it
 * answers in the same shape, so the page cannot tell which side replied.
 * Keep the two in step: a change to one is a change to both.
 *
 * The request: `switches[X].before` is the board before lever X, and for A that
 * is the starting combination the player entered; every later `before` is the
 * previous lever's `after`. `state` is the board after H. The start is never
 * sent on its own -- it is already inside A's mask.
 */

(function () {
  const GRID = 5;
  const LETTERS = "ABCDEFGH";
  const ALL_ON = Array.from({ length: GRID }, () => Array(GRID).fill(1));

  const xor = (a, b) => a.map((row, r) => row.map((v, c) => v ^ b[r][c]));
  const same = (a, b) => a.every((row, r) => row.every((v, c) => v === b[r][c]));

  function subsets(letters) {
    const found = [];
    for (const letter of letters) {
      const sofar = found.length;
      for (let i = 0; i < sofar; i++) found.push(letter + found[i]);
      found.push(letter);
    }
    found.push("");
    return found;
  }

  function grid(value, where) {
    if (!Array.isArray(value) || value.length !== GRID) {
      throw new Error(`${where} must be ${GRID} rows of ${GRID} lights.`);
    }
    return value.map((row, i) => {
      if (!Array.isArray(row) || row.length !== GRID) {
        throw new Error(`${where}: row ${i + 1} must have ${GRID} lights.`);
      }
      return row.map((cell) => (cell ? 1 : 0));
    });
  }

  function masks(switches) {
    if (!switches || typeof switches !== "object" || !Object.keys(switches).length) {
      throw new Error("No switches were recorded. Press each switch once and "
        + "note which lights changed.");
    }
    const out = {};
    for (const [raw, entry] of Object.entries(switches)) {
      const letter = String(raw).trim().toUpperCase();
      if (!LETTERS.includes(letter)) {
        throw new Error(`'${letter}' is not a switch. The switches are `
          + LETTERS.split("").join(", ") + ".");
      }
      out[letter] = entry && entry.before !== undefined
        ? xor(grid(entry.before, `Switch ${letter} (before)`),
              grid(entry.after, `Switch ${letter} (after)`))
        : grid(entry, `Switch ${letter}`);
    }
    return out;
  }

  window.LOCAL_SOLVERS = window.LOCAL_SOLVERS || {};
  window.LOCAL_SOLVERS["light-box"] = function (request) {
    let state, switches;
    try {
      state = grid(request.state, "The lights that are on");
      switches = masks(request.switches);
    } catch (exc) {
      return { ok: false, error: exc.message };
    }

    const order = LETTERS.split("").filter((letter) => letter in switches).join("");
    const found = [];
    for (const combo of subsets(order)) {
      let lights = state;
      for (const letter of combo) lights = xor(lights, switches[letter]);
      if (same(lights, ALL_ON)) found.push(combo);
    }

    const dead = Object.entries(switches)
      .filter(([, mask]) => mask.every((row) => row.every((v) => v === 0)))
      .map(([letter]) => letter);

    if (!found.length) {
      return {
        ok: true,
        solution: null,
        solutions: [],
        unusedSwitches: dead,
        message: "No solution found. Check the readings and try again."
          + "\nA single mis-noted light is enough to make a box look unsolvable.",
      };
    }

    const best = found[0];
    return {
      ok: true,
      solution: best.split("").sort(),
      sequence: best,
      presses: best.length,
      solutions: found.map((combo) => combo.split("").sort()),
      unusedSwitches: dead,
      message: best ? "Press each of these once." : "Every light is already on.",
    };
  };
})();

  };

  registerTool("light-box", {
    mount(page, tool) {
      const lights = Array.from({ length: ROWS }, () => Array(COLS).fill(false));
      const buttons = [];
      const levers = new Map();

      let started = false;
      let start = null;
      let current = null;
      const readings = new Map();
      let solved = false;

      const box = document.createElement("div");
      box.className = "lightbox";
      box.setAttribute("role", "group");
      box.setAttribute("aria-label", tool.title);

      for (let r = 0; r < ROWS; r++) {
        for (let c = 0; c < COLS; c++) {
          const light = document.createElement("button");
          light.type = "button";
          light.className = "light";
          light.style.left = LEFT[c] + "%";
          light.style.top = TOP[r] + "%";
          light.setAttribute("aria-pressed", "false");
          light.setAttribute("aria-label", "Light, row {r}, column {c}"
            .replace("{r}", r + 1).replace("{c}", c + 1));
          light.dataset.row = r;
          light.dataset.col = c;
          for (const state of ["off", "on"]) {
            const bulb = document.createElement("i");
            bulb.className = state;
            light.append(bulb);
          }
          box.append(light);
          buttons.push(light);
        }
      }

      /* One listener for the whole board rather than 25. */
      box.addEventListener("click", (event) => {
        const light = event.target.closest(".light");
        if (light && !light.disabled) toggle(+light.dataset.row, +light.dataset.col);
      });

      LEVERS.split("").forEach((label, index) => {
        const lever = osrsButton(label, {
          title: "Lever {label}".replace("{label}", label),
          onPress: () => chooseLever(label),
        });
        lever.classList.add("lever");
        lever.style.left = LEVER_LEFT[index % 4] + "cqw";
        lever.style.top = LEVER_TOP[Math.floor(index / 4)] + "cqw";
        lever.setAttribute("aria-pressed", "false");
        levers.set(label, lever);
        box.append(lever);
      });

      // --- the board ------------------------------------------------------

      function toggle(r, c) {
        set(r, c, !lights[r][c]);
        playSound(SOUND.light);
        refresh();
      }

      function set(r, c, on) {
        lights[r][c] = on;
        const light = buttons[r * COLS + c];
        light.classList.toggle("on", on);
        light.setAttribute("aria-pressed", String(on));
      }

      function clearLights() {
        for (let r = 0; r < ROWS; r++) {
          for (let c = 0; c < COLS; c++) set(r, c, false);
        }
      }

      function snapshot() {
        return lights.map((row) => row.map((on) => (on ? 1 : 0)));
      }

      function litCount() {
        return lights.flat().filter(Boolean).length;
      }

      // --- the starting combination ---------------------------------------

      /* Locks in the board as entered, then goes straight on to lever A, so the
         first thing left to do is read the board after pulling it. The start is
         not questioned the way a lever's reading is -- an empty board, or a
         nearly empty one, is a fair start. */
      function setStart() {
        if (started) return;
        start = snapshot();
        started = true;
        clearLights();
        chooseLever(LEVERS[0]);
      }

      // --- the lever sequence ---------------------------------------------

      function nextLever() {
        if (current === null) return LEVERS[0];
        const at = LEVERS.indexOf(current);
        return at < LEVERS.length - 1 ? LEVERS[at + 1] : null;
      }

      async function chooseLever(label) {
        if (!started || solved || label !== nextLever()) return;

        // Moving on locks in what is on the board as the reading for the lever
        // before this one, so this is the moment to question a thin board.
        if (current !== null) {
          const lit = litCount();
          if (lit < FEW_LIGHTS) {
            const go = await confirmAction({
              title: "Only {n} lit for lever {label}?".replace("{n}", lit).replace("{label}", current),
              message: "A lever usually changes more lights than that, so this often means a light was missed.",
              note: "Moving on locks lever {label} in as it stands.".replace("{label}", current),
              confirm: "Continue anyway",
            });
            if (!go) return;        // stay where we are; nothing is recorded
          }
          readings.set(current, snapshot());
          clearLights();
        }

        current = label;
        playSound(SOUND.leverIn);
        refresh();
      }

      function refresh() {
        const next = nextLever();
        for (const [label, lever] of levers) {
          const done = readings.has(label) || label === current;
          lever.pressed = done;
          lever.disabled = solved || !started || (!done && label !== next);
        }

        // Open for the start, and then for each lever's reading in turn.
        for (const light of buttons) light.disabled = solved;

        const lit = litCount();
        const ready = current === LEVERS.at(-1) && lit >= FEW_LIGHTS;

        // Only one of these is ever live: Set Start until it is set, then Solve.
        startBtn.disabled = started;
        solveBtn.disabled = solved || !ready;
        startPrompt.textContent = started ? "" : "Enter your starting combination";

        if (solved) return;
        if (!started) {
          flash("");
        } else if (ready) {
          flash("All eight levers recorded. Press Solve.");
        } else {
          flash("Lever {label}: tap every light that is on after pressing it.".replace("{label}", current)
            + (lit ? "  ·  " + "{n} lit".replace("{n}", lit) : ""));
        }
      }

      // --- solving ---------------------------------------------------------

      function request() {
        const switches = {};
        let before = start;
        for (const label of LEVERS) {
          const after = label === current ? snapshot() : readings.get(label);
          switches[label] = { before, after };
          before = after;
        }
        return { state: snapshot(), switches };
      }

      async function runSolve() {
        readings.set(current, snapshot());
        flash("Solving…");
        solveBtn.disabled = true;

        const data = await solve("light-box", request());

        if (!data.ok) {
          flash(data.error, true);
          solveBtn.disabled = false;
          return;
        }
        solved = true;
        refresh();

        if (data.solution === null) {
          flash(data.message, true);
          return;
        }
        flash("");
        showAnswer(data.solution);
      }

      function showAnswer(letters) {
        answer.hidden = false;
        answerCaption.textContent = letters.length
          ? "Press the levers in this order to solve:" : "Every light is already on.";
        answerChips.replaceChildren(
          ...letters.map((letter) => osrsChip(letter, { toggle: true })));
      }

      // --- resetting -------------------------------------------------------

      function touched() {
        return started || litCount() > 0;
      }

      function reset() {
        answer.hidden = true;
        answerCaption.textContent = "";
        answerChips.replaceChildren();
        clearLights();
        started = false;
        start = null;
        current = null;
        solved = false;
        readings.clear();
        playSound(SOUND.reset);
        refresh();
      }

      // --- the page --------------------------------------------------------

      const actions = document.createElement("div");
      actions.className = "toolactions";

      const resetBtn = document.createElement("button");
      resetBtn.type = "button";
      resetBtn.className = "secondary-btn";
      resetBtn.textContent = "Reset";
      resetBtn.addEventListener("click", async () => {
        if (!touched()) return;
        const go = await confirmAction({
          title: "Reset the board?",
          message: "Every light and lever goes back to how it started.",
          note: "This cannot be undone.",
          confirm: "Reset board",
        });
        if (go) reset();
      });

      const startBtn = document.createElement("button");
      startBtn.type = "button";
      startBtn.className = "primary-btn";
      startBtn.textContent = "Set Start";
      startBtn.addEventListener("click", setStart);

      const solveBtn = document.createElement("button");
      solveBtn.type = "button";
      solveBtn.className = "primary-btn";
      solveBtn.textContent = "Solve";
      solveBtn.addEventListener("click", runSolve);

      actions.append(resetBtn, startBtn, solveBtn);

      const answer = document.createElement("div");
      answer.className = "answer";
      answer.hidden = true;

      const answerCaption = document.createElement("p");
      answerCaption.className = "dict";

      const answerChips = document.createElement("div");
      answerChips.className = "osrs-chip-row";
      answer.append(answerCaption, answerChips);

      const hint = document.createElement("p");
      hint.className = "dict pagehint";
      hint.textContent = "Use this step by step interactive light box to mimic lights and levers in game to find the final solution.";

      const startPrompt = document.createElement("p");
      startPrompt.className = "startprompt";

      const status = document.getElementById("status");
      const statusHome = status.parentNode;

      page.append(hint, startPrompt, box, status, actions, answer);
      refresh();

      return () => statusHome.append(status);
    },
  });
})();
</script>

</body>
</html>
